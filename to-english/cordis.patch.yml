# dsh-to-english bundle patch: inserts the host-side plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
#   dsh plugin --profile web add link:<path-to-this-package>
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (watcher + translation pipeline + live reload + settings
# routes). The `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/dsh-to-english/client.js) load in
# the web GUI — the settings section.
- insert:
    - id: to-english
      name: '@creait/dsh-to-english'
