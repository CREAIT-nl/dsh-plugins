# @creait/dsh-research-mode bundle patch: inserts the ROSTER half into the
# profile. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); activate with
# `dsh plugin --profile <name> add @creait/dsh-research-mode`.
#
# Companion layer: `./presets/research.patch.yml` declares the `research` agent
# preset. Both files are listed in this package's `dsh.bundle.patch`, this one
# first.
#
# This row injects no service and registers nothing the model can see. What it
# does: sets this plugin's settings page policy and serves the loopback route the
# composer's width control reads and writes. No tool, no prompt section, no
# command — a normal session's system prompt and tool catalog are unchanged, and
# the width control gates itself on the session's preset, so it draws nothing
# outside research mode. The research loop lives in the preset, which mounts this
# package's OTHER entry point (`@creait/dsh-research-mode/tool`) inside its own
# `workflowEngine` realm.
#
# `config: { width: N }` seeds the pin as the composition default; the user's
# setting overrides it. 0 (the default) means no pin — the model chooses the
# width per call, bounded by the preset row's `maxWidth`.
#
# There is no "turn the tool on everywhere" switch here, and that is not an
# oversight: the tool half injects `workflowEngine`, which the Web surface mounts
# per preset. A row declaring it out here would wait for a service this
# composition never publishes. To have `deep_research` in another mode, add the
# tool row to that mode's preset, inside a group carrying
# `isolate: { workflowEngine: true }` alongside the `workflow-ptc` and
# `ptc-runtime` rows — see `presets/research.patch.yml`.
- insert:
    - id: research-mode
      name: '@creait/dsh-research-mode'
